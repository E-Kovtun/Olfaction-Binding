# orbind configuration

data:
  m2or_zip: "data/raw/M2OR.zip"          # full relational export (script 00)
  processed_dir: "data/processed"
  embeddings_dir: "data/embeddings"

filters:
  human_only: true            # species_id == Homo sapiens
  drop_mutants: true          # main_receptors.mutation non-empty
  mixture_policy: "mono"      # "mono" | "mono+isomers"  (main_compounds.mixture)
  binary_only: true           # responsive in {0, 1}
  drop_orphan_receptors: true # receptor with 0 positive pairs
  receptor_key: "sequence"    # SMILES & sequence are inline in the export (100%)

receptor_embedding:
  model: "esm2_t33_650M_UR50D"   # ESM-2 650M
  pooling: "mean"                # mean over residues -> 1280-d

molecule_embedding:
  stack: "rdkit + torch_geometric"   # SMILES -> PyG graph -> your GCN
