[project]
name = "orbind"
version = "0.0.1"
description = "Curated M2OR olfactory receptor-ligand binding pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    # core data prep (script 01)
    "pandas>=2.0",
    "numpy>=1.26,<2",          # dgl 2.2.1 has numpy<2 ABI
    # receptor embeddings (script 02): ESM-2
    "fair-esm>=2.0.0",
    # molecule graphs (script 03): RDKit + torch_geometric
    "rdkit>=2023.3",
    "torch-geometric>=2.5",
    "xgboost>=2.0,<3.0",           # MP boosting head (ProSmith/LORAX-style)
    "ipykernel>=6",           # run the screening notebook on the project .venv
    "matplotlib>=3.7",        # notebook plots (similarity heatmaps, etc.)
    # graph training/evaluation
    "torch>=2.2,<2.3",
    "setuptools<71",
    "pyyaml",
    "pydantic",
    "biopython>=1.87",
    "shap>=0.49.1",
    "umap-learn>=0.5",         # 3D projections for embedding-screening notebooks
    "plotly>=5.20",            # interactive 3D scatter plots in notebooks
    "optuna>=4.9.0",
]

[project.optional-dependencies]
# Optional legacy molecule-GIN tooling. DGL wheels are platform-specific and
# are not needed for full_full graph training/evaluation, so keep this out of
# the default environment. Install explicitly only when running dgllife/GIN
# embedding scripts.
gin = [
    "dgl==2.2.1",
    "dgllife>=0.3.2",
    "torchdata<0.8",          # dgl 2.2.1 imports torchdata.datapipes (removed in >=0.10)
]

[tool.uv]
# application, not a library; all deps mandatory so `uv run` always has a full env.
package = false

[dependency-groups]
dev = [
    "nbformat>=5.10.4",
    "jupyterlab>=4,<5",
]
